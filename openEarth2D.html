<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地形モデル生成ツール — GSI to SketchUp DAE/STL</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#f1f5f9;min-height:100vh;padding:20px;color:#1e293b}
.wrap{max-width:780px;margin:0 auto}
header{margin-bottom:16px}
h1{font-size:22px;font-weight:600;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.sub{color:#64748b;font-size:13px}
.card{background:#fff;border-radius:12px;border:1px solid #e2e8f0;padding:20px;margin-bottom:14px}
.card h2{font-size:15px;font-weight:600;margin-bottom:14px;color:#334155}
.inputs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.input-group label{display:block;font-size:11px;color:#64748b;margin-bottom:4px;font-weight:500}
.input-group input{width:100%;padding:8px 10px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;font-family:inherit}
.input-group input:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.hint{font-size:12px;color:#475569;margin-bottom:10px;padding:8px 12px;background:#f8fafc;border-radius:6px;border-left:3px solid #3b82f6}
#map{height:380px;width:100%;border-radius:8px;border:1px solid #e2e8f0;margin-bottom:12px}
.bbox-info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px}
.bbox-info > div{background:#f8fafc;border-radius:6px;padding:8px 10px}
.bbox-info span{color:#64748b;font-size:11px;display:block;margin-bottom:2px}
.bbox-info b{font-weight:600;color:#1e293b}
.formats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.fmt{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:8px;cursor:pointer;text-align:center;font-size:12px}
.fmt.active{background:#dbeafe;border-color:#2563eb}
.fmt b{display:block;font-size:13px;color:#1e293b;margin-bottom:2px}
.fmt span{font-size:10px;color:#64748b}
.btn{width:100%;padding:12px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;transition:background .15s}
.btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-success{background:#16a34a;color:#fff}.btn-success:hover{background:#15803d}
.btn-secondary{background:#f1f5f9;color:#475569;border:1px solid #cbd5e1}.btn-secondary:hover{background:#e2e8f0}
.btn:disabled{opacity:0.45;cursor:not-allowed}
.prog-wrap{background:#e2e8f0;border-radius:99px;height:8px;margin:12px 0;overflow:hidden}
.prog-fill{height:100%;background:#2563eb;border-radius:99px;width:0%;transition:width 0.4s}
.status{font-size:13px;color:#475569;margin-bottom:4px;font-weight:500}
.log{background:#0f172a;color:#94a3b8;border-radius:8px;padding:12px;max-height:220px;overflow-y:auto;font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.7}
.log .ok{color:#4ade80}.log .er{color:#f87171}.log .info{color:#60a5fa}
.steps{font-size:12px;color:#475569;line-height:2;margin-top:14px;padding-top:14px;border-top:1px solid #e2e8f0}
.steps code{background:#f1f5f9;border-radius:4px;padding:2px 6px;font-family:ui-monospace,monospace;font-size:11px}
.badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:99px;background:#dbeafe;color:#1e40af;font-weight:500;margin-left:6px}
.tip{background:#fef3c7;border-left:3px solid #f59e0b;padding:8px 12px;border-radius:6px;font-size:12px;color:#78350f;margin-top:10px}
@media(max-width:600px){.inputs{grid-template-columns:repeat(2,1fr)}.bbox-info,.formats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🗾 地形モデル生成ツール v3</h1>
    <p class="sub">国土地理院データ → SketchUp Go 用 DAE / STL ファイル</p>
  </header>

  <div id="configStep">
    <div class="card">
      <h2>① 場所と範囲を設定</h2>
      <div class="inputs">
        <div class="input-group"><label>緯度 Latitude</label><input id="latIn" type="number" step="0.000001" value="34.4620"></div>
        <div class="input-group"><label>経度 Longitude</label><input id="lonIn" type="number" step="0.000001" value="135.3750"></div>
        <div class="input-group"><label>範囲 Area (km)</label><input id="kmIn" type="number" step="0.1" min="0.2" max="5.0" value="1.0"></div>
        <div class="input-group"><label>グリッド Grid</label><input id="gridIn" type="number" step="1" min="11" max="51" value="21"></div>
      </div>
      <p class="hint">💡 地図をクリック、または赤いマーカーをドラッグで位置調整／入力欄を変更すると地図に反映されます</p>
      <div id="map"></div>
      <div class="bbox-info" id="bboxInfo"></div>
    </div>

    <div class="card">
      <h2>② 出力形式</h2>
      <div class="formats">
        <div class="fmt active" id="fmt-dae" onclick="setFmt('dae')">
          <b>DAE (Collada)</b>
          <span>テクスチャ自動貼付 ★推奨</span>
        </div>
        <div class="fmt" id="fmt-stl" onclick="setFmt('stl')">
          <b>STL</b>
          <span>メッシュのみ</span>
        </div>
        <div class="fmt" id="fmt-both" onclick="setFmt('both')">
          <b>両方</b>
          <span>DAE + STL 同梱</span>
        </div>
      </div>
      <div class="tip" id="fmtTip">
        📌 DAE形式: 航空写真が地形に自動で貼り付きます。SketchUp Go の <code>File → Import</code> から <code>DAE</code> を選択
      </div>
    </div>

    <button class="btn btn-primary" onclick="startGeneration()">▶ ③ 生成開始</button>
  </div>

  <div id="generateStep" style="display:none">
    <div class="card">
      <h2>③ データ取得中...</h2>
      <div class="status" id="statusTxt">準備中...</div>
      <div class="prog-wrap"><div class="prog-fill" id="progFill"></div></div>
      <div class="log" id="logBox"></div>
    </div>
    <div class="card" id="resultCard" style="display:none">
      <h2 style="color:#16a34a">✅ 生成完了!<span class="badge" id="resBadge"></span></h2>
      <button class="btn btn-success" onclick="doDownload()" style="margin-top:8px">📥 terrain.zip をダウンロード</button>
      <div class="steps" id="stepsArea"></div>
    </div>
    <button class="btn btn-secondary" onclick="goBack()" style="margin-top:8px">← 設定に戻る</button>
  </div>
</div>

<script>
let CFG = { lat:34.4620, lon:135.3750, km:1.0, n:21, zPhoto:16, format:'dae' };
let map, marker, rect;
let zipBlob = null;

function bbox(c=CFG) {
  const dlat = (c.km/2)/110.54;
  const dlon = (c.km/2)/(111.32*Math.cos(c.lat*Math.PI/180));
  return { n:c.lat+dlat, s:c.lat-dlat, w:c.lon-dlon, e:c.lon+dlon };
}
function deg2tile(lat, lon, z) {
  const n = Math.pow(2, z), lr = lat*Math.PI/180;
  return { x: Math.floor((lon+180)/360*n), y: Math.floor((1-Math.log(Math.tan(lr)+1/Math.cos(lr))/Math.PI)/2*n) };
}
function lonToWPx(lon, z) { return (lon+180)/360 * 256 * Math.pow(2,z); }
function latToWPy(lat, z) { const lr = lat*Math.PI/180; return (1 - Math.log(Math.tan(Math.PI/4 + lr/2))/Math.PI) / 2 * 256 * Math.pow(2,z); }

function setFmt(f) {
  CFG.format = f;
  ['dae','stl','both'].forEach(x => {
    document.getElementById('fmt-'+x).classList.toggle('active', x===f);
  });
  const tips = {
    dae: '📌 DAE形式: 航空写真が地形に自動で貼り付きます。SketchUp Go の <code>File → Import</code> から <code>DAE</code> を選択',
    stl: '📌 STL形式: 地形メッシュのみ（テクスチャなし）。航空写真は手動で投影マッピング必要',
    both: '📌 両方同梱: DAE優先で使用、STLはバックアップ'
  };
  document.getElementById('fmtTip').innerHTML = tips[f];
}

function initMap() {
  map = L.map('map').setView([CFG.lat, CFG.lon], 14);
  const photoLayer = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',
    { attribution:'<a href="https://www.gsi.go.jp/">国土地理院</a>', maxZoom:18 });
  const stdLayer = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png',
    { attribution:'<a href="https://www.gsi.go.jp/">国土地理院</a>', maxZoom:18 });
  photoLayer.addTo(map);
  L.control.layers({ '航空写真':photoLayer, '地理院地図':stdLayer }, null, { position:'topright', collapsed:false }).addTo(map);

  marker = L.marker([CFG.lat, CFG.lon], { draggable:true }).addTo(map);
  marker.bindTooltip('対象地点（ドラッグ可）');
  drawBbox();

  marker.on('drag', () => {
    const ll = marker.getLatLng();
    CFG.lat = ll.lat; CFG.lon = ll.lng;
    document.getElementById('latIn').value = ll.lat.toFixed(6);
    document.getElementById('lonIn').value = ll.lng.toFixed(6);
    drawBbox();
  });
  map.on('click', (e) => {
    CFG.lat = e.latlng.lat; CFG.lon = e.latlng.lng;
    marker.setLatLng(e.latlng);
    document.getElementById('latIn').value = CFG.lat.toFixed(6);
    document.getElementById('lonIn').value = CFG.lon.toFixed(6);
    drawBbox();
  });
  ['latIn','lonIn','kmIn','gridIn'].forEach(id => {
    document.getElementById(id).addEventListener('input', syncFromInputs);
  });
  updateInfo();
}

function syncFromInputs() {
  const lat = parseFloat(document.getElementById('latIn').value);
  const lon = parseFloat(document.getElementById('lonIn').value);
  const km  = parseFloat(document.getElementById('kmIn').value);
  const n   = parseInt(document.getElementById('gridIn').value);
  if (!isNaN(lat) && lat >= -85 && lat <= 85) CFG.lat = lat;
  if (!isNaN(lon) && lon >= -180 && lon <= 180) CFG.lon = lon;
  if (!isNaN(km) && km > 0 && km <= 5) CFG.km = km;
  if (!isNaN(n) && n >= 11 && n <= 51) CFG.n = n;
  marker.setLatLng([CFG.lat, CFG.lon]);
  drawBbox();
}

function drawBbox() {
  if (rect) map.removeLayer(rect);
  const bb = bbox();
  rect = L.rectangle([[bb.s, bb.w], [bb.n, bb.e]], { color:'#dc2626', weight:2, fillOpacity:0.08, dashArray:'6,4' }).addTo(map);
  updateInfo();
}

function updateInfo() {
  const bb = bbox();
  const xSize = (bb.e-bb.w)*111320*Math.cos(CFG.lat*Math.PI/180);
  const ySize = (bb.n-bb.s)*110540;
  const spacing = (CFG.km*1000)/(CFG.n-1);
  document.getElementById('bboxInfo').innerHTML =
    '<div><span>実寸サイズ</span><b>'+xSize.toFixed(0)+'m × '+ySize.toFixed(0)+'m</b></div>' +
    '<div><span>標高サンプル</span><b>'+(CFG.n*CFG.n)+' 点 ('+spacing.toFixed(0)+'m間隔)</b></div>' +
    '<div><span>境界 N/W</span><b>'+bb.n.toFixed(4)+'° / '+bb.w.toFixed(4)+'°</b></div>';
}

function log(msg, cls='') {
  const b = document.getElementById('logBox');
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = msg;
  b.appendChild(d); b.scrollTop = b.scrollHeight;
}
function setP(pct, txt) {
  document.getElementById('progFill').style.width = pct+'%';
  if (txt) document.getElementById('statusTxt').textContent = txt;
}

async function fetchElev(lat, lon) {
  const url = 'https://cyberjapandata2.gsi.go.jp/general/dem/scripts/getelevation.php?lon='+lon.toFixed(6)+'&lat='+lat.toFixed(6)+'&outtype=JSON';
  try {
    const r = await fetch(url);
    const d = await r.json();
    return (d.elevation != null) ? d.elevation : 0;
  } catch { return 0; }
}

async function getGrid(bb) {
  const N = CFG.n;
  const lats = Array.from({length:N}, (_,i) => bb.n - i*(bb.n-bb.s)/(N-1));
  const lons = Array.from({length:N}, (_,i) => bb.w + i*(bb.e-bb.w)/(N-1));
  const grid = []; let done = 0;
  for (let r = 0; r < N; r++) {
    const row = [];
    for (let c = 0; c < N; c += 5) {
      const batch = [];
      for (let k = 0; k < 5 && c+k < N; k++) batch.push(fetchElev(lats[r], lons[c+k]));
      const vals = await Promise.all(batch);
      row.push(...vals); done += vals.length;
      setP(done/(N*N)*55, '標高取得中... '+done+'/'+(N*N)+' 点');
    }
    grid.push(row);
    if (r % 5 === 0 || r === N-1) log('  行 '+(r+1)+'/'+N+' 完了', 'ok');
  }
  const flat = grid.flat();
  const minH = Math.min(...flat), maxH = Math.max(...flat);
  log('  標高範囲: '+minH.toFixed(1)+'m ~ '+maxH.toFixed(1)+'m (差 '+(maxH-minH).toFixed(1)+'m)', 'info');
  return { grid };
}

async function getPhoto(bb) {
  const z = CFG.zPhoto;
  const nw = deg2tile(bb.n, bb.w, z);
  const se = deg2tile(bb.s, bb.e, z);
  const txMin = Math.min(nw.x, se.x), txMax = Math.max(nw.x, se.x);
  const tyMin = Math.min(nw.y, se.y), tyMax = Math.max(nw.y, se.y);
  const cols = txMax-txMin+1, rows = tyMax-tyMin+1, tot = cols*rows;
  log('  タイル: '+cols+'×'+rows+' = '+tot+'枚 (zoom='+z+')');

  const cvs = document.createElement('canvas');
  cvs.width = cols*256; cvs.height = rows*256;
  const ctx = cvs.getContext('2d');
  let done = 0, corsOk = true;

  for (let ty = tyMin; ty <= tyMax; ty++) {
    for (let tx = txMin; tx <= txMax; tx++) {
      const url = 'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/'+z+'/'+tx+'/'+ty+'.jpg';
      const img = await new Promise(res => {
        const im = new Image();
        im.crossOrigin = 'anonymous';
        im.onload = () => res(im);
        im.onerror = () => res(null);
        im.src = url;
      });
      if (img) {
        try { ctx.drawImage(img, (tx-txMin)*256, (ty-tyMin)*256, 256, 256); } catch { corsOk = false; }
      }
      done++;
      setP(55 + done/tot*25, '航空写真取得中... '+done+'/'+tot+' 枚');
    }
  }

  const baseX = txMin * 256, baseY = tyMin * 256;
  const xMin = lonToWPx(bb.w, z) - baseX;
  const xMax = lonToWPx(bb.e, z) - baseX;
  const yMin = latToWPy(bb.n, z) - baseY;
  const yMax = latToWPy(bb.s, z) - baseY;
  const cx = Math.max(0, Math.round(xMin));
  const cy = Math.max(0, Math.round(yMin));
  const cw = Math.min(cvs.width - cx, Math.round(xMax - xMin));
  const ch = Math.min(cvs.height - cy, Math.round(yMax - yMin));

  const out = document.createElement('canvas');
  out.width = Math.min(cw, 2048);
  out.height = Math.min(ch, 2048);
  out.getContext('2d').drawImage(cvs, cx, cy, cw, ch, 0, 0, out.width, out.height);

  try {
    const blob = await new Promise(res => out.toBlob(res, 'image/jpeg', 0.92));
    log('  航空写真: '+out.width+'×'+out.height+'px', corsOk ? 'ok' : 'er');
    return { blob, ok:corsOk };
  } catch (e) {
    log('  CORS制限のためテクスチャ取得失敗', 'er');
    return { blob:null, ok:false };
  }
}

function calcNormal(v1, v2, v3) {
  const ux = v2[0]-v1[0], uy = v2[1]-v1[1], uz = v2[2]-v1[2];
  const vx = v3[0]-v1[0], vy = v3[1]-v1[1], vz = v3[2]-v1[2];
  const nx = uy*vz - uz*vy, ny = uz*vx - ux*vz, nz = ux*vy - uy*vx;
  const len = Math.sqrt(nx*nx + ny*ny + nz*nz);
  return len === 0 ? [0,0,1] : [nx/len, ny/len, nz/len];
}

function makeSTL(grid, bb) {
  const N = CFG.n;
  const lat0 = (bb.n+bb.s)/2;
  const xSize = (bb.e-bb.w)*111320*Math.cos(lat0*Math.PI/180);
  const ySize = (bb.n-bb.s)*110540;
  const V = (r, c) => [ (c/(N-1))*xSize, ((N-1-r)/(N-1))*ySize, grid[r][c] ];

  const tris = [];
  for (let r = 0; r < N-1; r++) {
    for (let c = 0; c < N-1; c++) {
      const A = V(r,c), B = V(r,c+1), D = V(r+1,c), E = V(r+1,c+1);
      tris.push({ n:calcNormal(A,D,E), v:[A,D,E] });
      tris.push({ n:calcNormal(A,E,B), v:[A,E,B] });
    }
  }

  const size = 84 + tris.length * 50;
  const buf = new ArrayBuffer(size);
  const dv = new DataView(buf);
  const hdr = 'GSI terrain '+CFG.km+'km @ '+CFG.lat.toFixed(4)+','+CFG.lon.toFixed(4);
  for (let i = 0; i < 80; i++) dv.setUint8(i, i < hdr.length ? hdr.charCodeAt(i) : 0);
  dv.setUint32(80, tris.length, true);

  let off = 84;
  for (const t of tris) {
    dv.setFloat32(off, t.n[0], true); off += 4;
    dv.setFloat32(off, t.n[1], true); off += 4;
    dv.setFloat32(off, t.n[2], true); off += 4;
    for (let i = 0; i < 3; i++) {
      dv.setFloat32(off, t.v[i][0], true); off += 4;
      dv.setFloat32(off, t.v[i][1], true); off += 4;
      dv.setFloat32(off, t.v[i][2], true); off += 4;
    }
    dv.setUint16(off, 0, true); off += 2;
  }
  log('  STL三角形: '+tris.length+'個 ('+(size/1024).toFixed(0)+'KB)', 'ok');
  return { buffer:buf, count:tris.length, xSize, ySize };
}

// ============================================================
// DAE (Collada 1.4.1) 生成 — テクスチャ付き
// ============================================================
function makeDAE(grid, bb, hasTexture) {
  const N = CFG.n;
  const lat0 = (bb.n+bb.s)/2;
  const xSize = (bb.e-bb.w)*111320*Math.cos(lat0*Math.PI/180);
  const ySize = (bb.n-bb.s)*110540;

  // 頂点位置とUV
  const positions = [];
  const texcoords = [];
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const x = (c/(N-1)) * xSize;
      const y = ((N-1-r)/(N-1)) * ySize;
      const z = grid[r][c];
      positions.push(x.toFixed(3), y.toFixed(3), z.toFixed(3));
      // UV: u=west→east, v=south→north (Collada V軸は下→上)
      const u = c/(N-1);
      const v = (N-1-r)/(N-1);
      texcoords.push(u.toFixed(5), v.toFixed(5));
    }
  }

  // 三角形インデックス
  const indices = [];
  const vIdx = (r, c) => r*N + c;
  for (let r = 0; r < N-1; r++) {
    for (let c = 0; c < N-1; c++) {
      const A = vIdx(r,c), B = vIdx(r,c+1), D = vIdx(r+1,c), E = vIdx(r+1,c+1);
      indices.push(A, D, E);
      indices.push(A, E, B);
    }
  }

  const triCount = indices.length / 3;
  const vCount = N * N;
  const date = new Date().toISOString();

  // テクスチャあり版とテクスチャなし版で分岐
  const effectBlock = hasTexture ? `
    <library_images>
      <image id="aerial-img" name="aerial">
        <init_from>terrain_aerial.jpg</init_from>
      </image>
    </library_images>
    <library_effects>
      <effect id="terrain-fx">
        <profile_COMMON>
          <newparam sid="aerial-surface">
            <surface type="2D"><init_from>aerial-img</init_from></surface>
          </newparam>
          <newparam sid="aerial-sampler">
            <sampler2D><source>aerial-surface</source></sampler2D>
          </newparam>
          <technique sid="common">
            <lambert>
              <diffuse>
                <texture texture="aerial-sampler" texcoord="UVMap"/>
              </diffuse>
            </lambert>
          </technique>
        </profile_COMMON>
      </effect>
    </library_effects>` : `
    <library_effects>
      <effect id="terrain-fx">
        <profile_COMMON>
          <technique sid="common">
            <lambert>
              <diffuse><color>0.6 0.7 0.5 1</color></diffuse>
            </lambert>
          </technique>
        </profile_COMMON>
      </effect>
    </library_effects>`;

  const uvSource = hasTexture ? `
        <source id="terrain-uv">
          <float_array id="terrain-uv-array" count="${vCount*2}">${texcoords.join(' ')}</float_array>
          <technique_common>
            <accessor source="#terrain-uv-array" count="${vCount}" stride="2">
              <param name="S" type="float"/>
              <param name="T" type="float"/>
            </accessor>
          </technique_common>
        </source>` : '';

  const uvInput = hasTexture ? `
          <input semantic="TEXCOORD" source="#terrain-uv" offset="0" set="0"/>` : '';

  const uvBind = hasTexture ? `
                <bind_vertex_input semantic="UVMap" input_semantic="TEXCOORD" input_set="0"/>` : '';

  const xml = `<?xml version="1.0" encoding="utf-8"?>
<COLLADA xmlns="http://www.collada.org/2005/11/COLLADASchema" version="1.4.1">
  <asset>
    <contributor>
      <authoring_tool>GSI Terrain Generator v3</authoring_tool>
      <comment>Source: 国土地理院 (GSI) — center ${CFG.lat.toFixed(4)},${CFG.lon.toFixed(4)} / ${CFG.km}km</comment>
    </contributor>
    <created>${date}</created>
    <modified>${date}</modified>
    <unit name="meter" meter="1"/>
    <up_axis>Z_UP</up_axis>
  </asset>${effectBlock}
  <library_materials>
    <material id="terrain-mat" name="Terrain">
      <instance_effect url="#terrain-fx"/>
    </material>
  </library_materials>
  <library_geometries>
    <geometry id="terrain-geo" name="terrain">
      <mesh>
        <source id="terrain-pos">
          <float_array id="terrain-pos-array" count="${vCount*3}">${positions.join(' ')}</float_array>
          <technique_common>
            <accessor source="#terrain-pos-array" count="${vCount}" stride="3">
              <param name="X" type="float"/>
              <param name="Y" type="float"/>
              <param name="Z" type="float"/>
            </accessor>
          </technique_common>
        </source>${uvSource}
        <vertices id="terrain-vertices">
          <input semantic="POSITION" source="#terrain-pos"/>
        </vertices>
        <triangles material="terrain-mat-sym" count="${triCount}">
          <input semantic="VERTEX" source="#terrain-vertices" offset="0"/>${uvInput}
          <p>${indices.join(' ')}</p>
        </triangles>
      </mesh>
    </geometry>
  </library_geometries>
  <library_visual_scenes>
    <visual_scene id="Scene" name="Scene">
      <node id="terrain-node" name="terrain">
        <instance_geometry url="#terrain-geo">
          <bind_material>
            <technique_common>
              <instance_material symbol="terrain-mat-sym" target="#terrain-mat">${uvBind}
              </instance_material>
            </technique_common>
          </bind_material>
        </instance_geometry>
      </node>
    </visual_scene>
  </library_visual_scenes>
  <scene>
    <instance_visual_scene url="#Scene"/>
  </scene>
</COLLADA>`;

  log('  DAE: '+vCount+'頂点, '+triCount+'三角形, '+(hasTexture?'テクスチャ付き':'メッシュのみ')+' ('+(xml.length/1024).toFixed(0)+'KB)', 'ok');
  return { xml, count:triCount, xSize, ySize };
}

async function startGeneration() {
  document.getElementById('configStep').style.display = 'none';
  document.getElementById('generateStep').style.display = 'block';
  document.getElementById('resultCard').style.display = 'none';
  document.getElementById('logBox').innerHTML = '';
  setP(0, '開始...');
  try {
    const bb = bbox();
    log('設定: 中心('+CFG.lat.toFixed(4)+', '+CFG.lon.toFixed(4)+') / '+CFG.km+'km / '+CFG.n+'×'+CFG.n);
    log('形式: '+CFG.format.toUpperCase(), 'info');

    setP(2, '標高データを取得中...');
    log('=== [1/3] 標高データ (GSI 数値標高モデル) ===');
    const { grid } = await getGrid(bb);
    log('標高取得 完了', 'ok');

    setP(55, '航空写真を取得中...');
    log('=== [2/3] 航空写真 (GSI シームレス写真) ===');
    const photo = await getPhoto(bb);
    const hasTex = photo.ok && !!photo.blob;

    setP(80, '3Dファイルを生成中...');
    log('=== [3/3] 3Dモデル生成 ===');

    const zip = new JSZip();
    let xSize = 0, ySize = 0;

    if (CFG.format === 'dae' || CFG.format === 'both') {
      const dae = makeDAE(grid, bb, hasTex);
      zip.file('terrain.dae', dae.xml);
      xSize = dae.xSize; ySize = dae.ySize;
    }
    if (CFG.format === 'stl' || CFG.format === 'both') {
      const stl = makeSTL(grid, bb);
      zip.file('terrain.stl', stl.buffer);
      xSize = stl.xSize; ySize = stl.ySize;
    }
    if (photo.blob) zip.file('terrain_aerial.jpg', photo.blob);

    log('実寸: '+xSize.toFixed(0)+'m × '+ySize.toFixed(0)+'m', 'info');

    setP(92, 'ZIPを作成中...');
    const meta = '# 地形モデル メタデータ\n'+
      '中心座標: '+CFG.lat+'°N, '+CFG.lon+'°E\n'+
      '範囲: '+CFG.km+'km × '+CFG.km+'km\n'+
      '実寸: '+xSize.toFixed(1)+'m × '+ySize.toFixed(1)+'m\n'+
      'グリッド: '+CFG.n+'×'+CFG.n+'点 ('+(CFG.km*1000/(CFG.n-1)).toFixed(1)+'m間隔)\n'+
      '形式: '+CFG.format.toUpperCase()+'\n'+
      '座標系: SketchUp (X=東, Y=北, Z=上) / 単位:メートル\n'+
      'テクスチャ: '+(hasTex?'あり (terrain_aerial.jpg)':'なし')+'\n'+
      'データ: 国土地理院\n'+
      '生成日: '+new Date().toLocaleString('ja-JP')+'\n\n'+
      '# インポート方法\n'+
      'DAE: terrain.dae と terrain_aerial.jpg を同じフォルダに置く → SketchUp Go で terrain.dae を Import\n'+
      'STL: terrain.stl を Import (単位:Meters) → 航空写真は手動で投影マッピング\n';
    zip.file('README.txt', meta);

    zipBlob = await zip.generateAsync({ type:'blob', compression:'DEFLATE' });

    setP(100, '完了!');
    log('=== 完了! ===', 'ok');
    document.getElementById('resBadge').textContent = hasTex ? '航空写真テクスチャ付き' : 'メッシュのみ';

    // インポート手順を形式別に表示
    let stepsHtml = '<strong>SketchUp Go インポート手順</strong><br>';
    if (CFG.format === 'dae' || CFG.format === 'both') {
      stepsHtml += '<br><b>★ DAE形式 (推奨・テクスチャ自動貼付):</b><br>';
      stepsHtml += '1. ZIP を解凍（<code>terrain.dae</code> と <code>terrain_aerial.jpg</code> は<strong>同じフォルダに</strong>必要）<br>';
      stepsHtml += '2. SketchUp Go → <code>File → Import</code><br>';
      stepsHtml += '3. ファイル形式: <code>COLLADA (*.dae)</code> を選択<br>';
      stepsHtml += '4. <code>terrain.dae</code> を選択 → Import<br>';
      stepsHtml += '5. 航空写真が地形に自動で貼り付きます ✨<br>';
    }
    if (CFG.format === 'stl' || CFG.format === 'both') {
      stepsHtml += '<br><b>STL形式 (メッシュのみ):</b><br>';
      stepsHtml += '1. ZIP を解凍<br>';
      stepsHtml += '2. SketchUp Go → <code>File → Import</code> → <code>STL (*.stl)</code><br>';
      stepsHtml += '3. <code>terrain.stl</code> を選択 → 単位: <strong>Meters</strong><br>';
    }
    document.getElementById('stepsArea').innerHTML = stepsHtml;
    document.getElementById('resultCard').style.display = 'block';
  } catch (err) {
    log('エラー: ' + err.message, 'er');
    console.error(err);
  }
}

function doDownload() {
  if (!zipBlob) return;
  const url = URL.createObjectURL(zipBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'terrain_'+CFG.lat.toFixed(4)+'_'+CFG.lon.toFixed(4)+'_'+CFG.km+'km.zip';
  a.click();
  URL.revokeObjectURL(url);
}

function goBack() {
  document.getElementById('generateStep').style.display = 'none';
  document.getElementById('configStep').style.display = 'block';
}

window.addEventListener('DOMContentLoaded', initMap);
</script>
</body>
</html>
